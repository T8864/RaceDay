name: RaceDay CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay.API/RaceDay.API.sln

    - name: Build API
      run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore -c Release

    - name: Build MVC
      run: dotnet build RaceDay.MVC/RaceDay.MVC.csproj --no-restore -c Release

    - name: Run tests
      run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --no-restore --verbosity normal